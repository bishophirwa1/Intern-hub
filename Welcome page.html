<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>

    <style>
        body{
            margin:0;
            height:100vh;
            font-family: Arial, Helvetica, sans-serif;
            color:white;
            text-align:center;
            overflow:hidden;
        }

        /* CARD */
        .card{
            position: relative;
            z-index: 1;
            background: rgba(0,0,0,0.35);
            backdrop-filter: blur(12px);
            padding:40px;
            border-radius:10px;
            top:50%;
            transform: translateY(-50%);
            width:300px;
            margin:auto;
        }

        button{
            margin-top:20px;
            padding:10px 20px;
            border:none;
            border-radius:5px;
            cursor:pointer;
            font-weight:bold;
        }

        /* BACKGROUND SLIDER */
        .bg-slider {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .bg {
            position: absolute;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 2s ease-in-out;
        }

        .bg.active {
            opacity: 1;
        }

        .bg::after {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
        }
    </style>
</head>
<body>

    <!-- Background Images -->
    <div class="bg-slider">
        <div class="bg active" style="background-image: url('building.jpg');"></div>
        <div class="bg" style="background-image: url('cooking.jpg');"></div>
        <div class="bg" style="background-image: url('coding.jpg');"></div>
        <div class="bg" style="background-image: url('electricians.jpg');"></div>
        <div class="bg" style="background-image: url('toraa.jpg');"></div>
        <div class="bg" style="background-image: url('torr.jpg');"></div>
    </div>

    <!-- Welcome Card -->
    <div class="card">
        <h1 id="welcomeText"></h1>
        <p>You have successfully logged in </p>
        <button onclick="goNext()">Advance</button>
    </div>

    <script>
        // Get user from login page
        const user = localStorage.getItem("loggedInUser");

        if (!user) {
            // If no name, go back to login
            window.location.href = "index.html";
        } else {
            document.getElementById("welcomeText").innerText = "Welcome, " + user + "!";
        }

        // Button function
        function goNext(){
            window.location.href = "Oral.html";
        }

        // Background slider
        const backgrounds = document.querySelectorAll('.bg');
        let index = 0;

        function changeBackground() {
            backgrounds[index].classList.remove('active');
            index = (index + 1) % backgrounds.length;
            backgrounds[index].classList.add('active');
        }

        setInterval(changeBackground, 5000);
    </script>

</body>
</html>
