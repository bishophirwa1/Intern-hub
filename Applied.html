<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Successful</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            color:white;
            overflow:hidden;
        }

        /* Background slider */
        .bg-slider{
            position:fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            z-index:-1;
        }

        .bg{
            position:absolute;
            width:100%;
            height:100%;
            background-size:cover;
            background-position:center;
            opacity:0;
            transition:opacity 2s ease-in-out;
        }

        .bg.active{ opacity:1; }

        .bg::after{
            content:"";
            position:absolute;
            width:100%;
            height:100%;
            background:rgba(0,0,0,0.6);
        }

        .card{
            width:450px;
            padding:40px;
            border-radius:25px;
            text-align:center;

            background:rgba(255,255,255,0.08);
            backdrop-filter:blur(15px);
            border:1px solid rgba(255,255,255,0.15);
        }

        .icon{
            font-size:70px;
            color:#22c55e;
            margin-bottom:20px;
        }

        h1{
            margin-bottom:15px;
        }

        p{
            color:#ddd;
            margin-bottom:25px;
        }

        button{
            padding:12px 25px;
            border:none;
            border-radius:10px;
            cursor:pointer;
            font-weight:bold;
            background:#3aafa9;
            color:white;
            transition:0.3s;
        }

        button:hover{
            transform:scale(1.05);
            background:white;
            color:black;
        }
    </style>
</head>
<body>

    <!-- Background images -->
    <div class="bg-slider">
        <div class="bg active" style="background-image:url('building.jpg')"></div>
        <div class="bg" style="background-image:url('coding.jpg')"></div>
        <div class="bg" style="background-image:url('cooking.jpg')"></div>
        <div class="bg" style="background-image:url('electricians.jpg')"></div>
    </div>

    <div class="card">
        <div class="icon">
            <i class="fa-solid fa-circle-check"></i>
        </div>

        <h1>Application Successful!</h1>
        <p>Your internship application has been submitted successfully.</p>

        <button onclick="goHome()">Back to Opportunities</button>
    </div>

    <script>
        function goHome(){
            window.location.href = "Oral.html";
        }

        // background slider
        const backgrounds = document.querySelectorAll('.bg');
        let index = 0;

        function changeBackground(){
            backgrounds[index].classList.remove('active');
            index = (index + 1) % backgrounds.length;
            backgrounds[index].classList.add('active');
        }

        setInterval(changeBackground,5000);
    </script>

</body>
</html>
